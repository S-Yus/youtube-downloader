<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Downloader</title>
<style>
  :root {
    --bg: #0F0F0F;
    --surface: #212121;
    --surface-hover: #2a2a2a;
    --border: #303030;
    --text: #ffffff;
    --text-dim: #aaaaaa;
    --red: #FF0000;
    --red-glow: #ff4e45;
    --blue: #3EA6FF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }

  /* ---------- ヘッダー ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .logo {
    width: 52px; height: 38px;
    background: var(--red);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px rgba(255,0,0,0.45);
  }
  .logo::after {
    content: "";
    border-style: solid;
    border-width: 9px 0 9px 15px;
    border-color: transparent transparent transparent #fff;
    margin-left: 3px;
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
  h1 span { color: var(--red); }
  .subtitle { color: var(--text-dim); margin-bottom: 36px; font-size: 14px; }

  /* ---------- URL入力 ---------- */
  .container { width: 100%; max-width: 720px; }
  .url-box {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  .url-box input {
    flex: 1;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 20px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .url-box input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(62,166,255,0.2);
  }
  .url-box button {
    background: var(--blue);
    color: #0F0F0F;
    border: none;
    border-radius: 16px;
    padding: 14px 26px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s, background .2s;
  }
  .url-box button:hover { background: #66bbff; }
  .url-box button:active { transform: scale(0.97); }
  .url-box button:disabled { background: #1a1a1a; color: #555; cursor: not-allowed; }

  /* ---------- 動画情報カード ---------- */
  .video-card {
    display: none;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    gap: 18px;
    margin-bottom: 24px;
    align-items: center;
    animation: fadeUp .35s ease;
  }
  .video-card.show { display: flex; }
  .video-card img {
    width: 200px;
    max-width: 40%;
    border-radius: 14px;
    display: block;
  }
  .video-meta { flex: 1; min-width: 0; }
  .video-meta .title {
    font-size: 16px; font-weight: 700; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .video-meta .info { color: var(--text-dim); font-size: 13px; line-height: 1.7; }

  /* ---------- 画質選択カード ---------- */
  .quality-section { display: none; margin-bottom: 24px; animation: fadeUp .35s ease; }
  .quality-section.show { display: block; }
  .quality-section h2 { font-size: 15px; color: var(--text-dim); margin-bottom: 14px; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 20px 16px;
    cursor: pointer;
    text-align: center;
    transition: border-color .2s, transform .15s, box-shadow .2s, background .2s;
    user-select: none;
  }
  .card:hover {
    border-color: var(--blue);
    background: var(--surface-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .card.selected {
    border-color: var(--red);
    box-shadow: 0 0 18px rgba(255,0,0,0.35);
  }
  .card .emoji { font-size: 30px; margin-bottom: 10px; }
  .card .name { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .card .desc { color: var(--text-dim); font-size: 12px; line-height: 1.5; }

  /* ---------- ダウンロードボタン ---------- */
  .dl-btn {
    display: none;
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 24px;
    box-shadow: 0 0 24px rgba(255,0,0,0.4);
    transition: background .2s, transform .1s, box-shadow .2s;
    animation: fadeUp .35s ease;
  }
  .dl-btn.show { display: block; }
  .dl-btn:hover { background: var(--red-glow); box-shadow: 0 0 32px rgba(255,0,0,0.6); }
  .dl-btn:active { transform: scale(0.98); }
  .dl-btn:disabled { background: #1a1a1a; color: #555; box-shadow: none; cursor: not-allowed; }

  /* ---------- プログレス ---------- */
  .progress-section {
    display: none;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 24px;
    animation: fadeUp .35s ease;
  }
  .progress-section.show { display: block; }
  .progress-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 14px;
  }
  .progress-head .pct { font-weight: 700; font-size: 18px; }
  .progress-head .speed { color: var(--blue); font-weight: 700; }
  .bar-track {
    background: #0F0F0F;
    border-radius: 12px;
    height: 18px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--red), var(--red-glow));
    border-radius: 12px;
    transition: width .3s ease;
  }
  .progress-status { color: var(--text-dim); font-size: 13px; margin-top: 10px; }

  /* ---------- 完了 / エラー ---------- */
  .result {
    display: none;
    border-radius: 20px;
    padding: 26px;
    text-align: center;
    animation: fadeUp .35s ease;
  }
  .result.show { display: block; }
  .result.success { background: var(--surface); border: 2px solid var(--red); box-shadow: 0 0 24px rgba(255,0,0,0.25); }
  .result.error { background: var(--surface); border: 2px solid #ff6b6b; }
  .result .big { font-size: 34px; margin-bottom: 10px; }
  .result .msg { font-size: 15px; margin-bottom: 18px; line-height: 1.6; word-break: break-word; }
  .result a.save-btn, .result button.retry-btn {
    display: inline-block;
    background: var(--blue);
    color: #0F0F0F;
    text-decoration: none;
    border: none;
    border-radius: 14px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
  }
  .result a.save-btn:hover, .result button.retry-btn:hover { background: #66bbff; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  footer { margin-top: auto; padding-top: 40px; color: #555; font-size: 12px; }

  @media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; }
    .video-card { flex-direction: column; }
    .video-card img { width: 100%; max-width: 100%; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <h1>You<span>Tube</span> Downloader</h1>
  </header>
  <p class="subtitle">YouTubeのURLを貼り付けて、好きな形式でダウンロード</p>

  <div class="container">
    <!-- URL入力 -->
    <div class="url-box">
      <input id="urlInput" type="text"
             placeholder="https://www.youtube.com/watch?v=...  /  youtu.be/...  /  shorts/..."
             autocomplete="off">
      <button id="fetchBtn">解析</button>
    </div>

    <!-- 動画情報 -->
    <div class="video-card" id="videoCard">
      <img id="thumb" alt="サムネイル">
      <div class="video-meta">
        <div class="title" id="videoTitle"></div>
        <div class="info" id="videoInfo"></div>
      </div>
    </div>

    <!-- 画質選択 -->
    <div class="quality-section" id="qualitySection">
      <h2>ダウンロード形式を選択</h2>
      <div class="cards">
        <div class="card" data-mode="best">
          <div class="emoji">🏆</div>
          <div class="name">最高画質</div>
          <div class="desc">最高解像度の動画+音声<br>(MP4)</div>
        </div>
        <div class="card" data-mode="720p">
          <div class="emoji">📺</div>
          <div class="name">720p</div>
          <div class="desc">バランスの良い<br>標準HD画質</div>
        </div>
        <div class="card" data-mode="mp3">
          <div class="emoji">🎵</div>
          <div class="name">音声のみ (MP3)</div>
          <div class="desc">音声をMP3に変換<br>(192kbps)</div>
        </div>
      </div>
    </div>

    <!-- ダウンロード実行 -->
    <button class="dl-btn" id="dlBtn">⬇ ダウンロード開始</button>

    <!-- プログレス -->
    <div class="progress-section" id="progressSection">
      <div class="progress-head">
        <span class="pct" id="pct">0%</span>
        <span class="speed" id="speed">-- KB/s</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <div class="progress-status" id="progressStatus"><span class="spinner"></span>ダウンロード中...</div>
    </div>

    <!-- 結果 -->
    <div class="result" id="result">
      <div class="big" id="resultEmoji"></div>
      <div class="msg" id="resultMsg"></div>
      <a class="save-btn" id="saveLink" style="display:none" href="#">💾 ファイルを保存</a>
      <button class="retry-btn" id="retryBtn" style="display:none">やり直す</button>
    </div>
  </div>

  <footer>YouTube Downloader — Powered by yt-dlp</footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const urlInput = $("urlInput"), fetchBtn = $("fetchBtn");
  const videoCard = $("videoCard"), qualitySection = $("qualitySection");
  const dlBtn = $("dlBtn"), progressSection = $("progressSection");
  const result = $("result");

  let selectedMode = null;
  let currentUrl = null;
  let pollTimer = null;

  const VIDEO_RE = [
    /(?:www\.|m\.)?youtube\.com\/watch\?.*v=[\w-]{6,}/,
    /youtu\.be\/[\w-]{6,}/,
    /(?:www\.|m\.)?youtube\.com\/shorts\/[\w-]{6,}/,
  ];
  const isVideoUrl = (u) => VIDEO_RE.some((re) => re.test(u));

  // APIレスポンスをJSONとして解釈する。HTML等が返ってきた場合は
  // サーバー未起動 / 静的ホスティングと判断して分かりやすいエラーにする。
  async function parseJson(res) {
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch {
      throw new Error(
        "サーバーに接続できませんでした。このページはFlaskサーバー経由で開く必要があります。\n" +
        "「python app.py」を実行して http://localhost:5000 を開いてください。\n" +
        "(index.htmlを直接開いたり、GitHub Pagesではダウンロード機能は動作しません)"
      );
    }
  }

  function resetViews() {
    videoCard.classList.remove("show");
    qualitySection.classList.remove("show");
    dlBtn.classList.remove("show");
    progressSection.classList.remove("show");
    result.classList.remove("show", "success", "error");
    document.querySelectorAll(".card").forEach((c) => c.classList.remove("selected"));
    selectedMode = null;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function showError(msg) {
    result.className = "result show error";
    $("resultEmoji").textContent = "⚠️";
    $("resultMsg").textContent = msg;
    $("saveLink").style.display = "none";
    $("retryBtn").style.display = "inline-block";
  }

  function fmtDuration(sec) {
    if (sec == null) return "";
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
  }

  // ---------- 動画情報の取得 ----------
  async function fetchInfo() {
    const url = urlInput.value.trim();
    resetViews();
    if (!isVideoUrl(url)) {
      showError("YouTubeの動画URLを入力してください (watch?v= / youtu.be / shorts に対応)");
      return;
    }
    fetchBtn.disabled = true;
    fetchBtn.innerHTML = '<span class="spinner"></span>解析中';
    try {
      const res = await fetch("/api/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await parseJson(res);
      if (!res.ok) throw new Error(data.error || "動画情報の取得に失敗しました。");

      currentUrl = url;
      $("thumb").src = data.thumbnail || "";
      $("videoTitle").textContent = data.title || "(タイトル不明)";
      const parts = [];
      if (data.uploader) parts.push("📤 " + data.uploader);
      if (data.duration != null) parts.push("⏱ " + fmtDuration(data.duration));
      if (data.view_count != null) parts.push("👁 " + data.view_count.toLocaleString() + " 回視聴");
      $("videoInfo").textContent = parts.join("　");

      videoCard.classList.add("show");
      qualitySection.classList.add("show");
    } catch (e) {
      showError(e.message);
    } finally {
      fetchBtn.disabled = false;
      fetchBtn.textContent = "解析";
    }
  }

  fetchBtn.addEventListener("click", fetchInfo);
  urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") fetchInfo(); });

  // ---------- 画質カード選択 ----------
  document.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("click", () => {
      document.querySelectorAll(".card").forEach((c) => c.classList.remove("selected"));
      card.classList.add("selected");
      selectedMode = card.dataset.mode;
      dlBtn.classList.add("show");
    });
  });

  // ---------- ダウンロード開始 ----------
  dlBtn.addEventListener("click", async () => {
    if (!currentUrl || !selectedMode) return;
    dlBtn.disabled = true;
    result.classList.remove("show", "success", "error");
    progressSection.classList.add("show");
    $("pct").textContent = "0%";
    $("speed").textContent = "-- KB/s";
    $("barFill").style.width = "0%";
    $("progressStatus").innerHTML = '<span class="spinner"></span>ダウンロード中...';

    try {
      const res = await fetch("/api/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: currentUrl, mode: selectedMode }),
      });
      const data = await parseJson(res);
      if (!res.ok) throw new Error(data.error || "ダウンロードを開始できませんでした。");
      pollProgress(data.job_id);
    } catch (e) {
      progressSection.classList.remove("show");
      dlBtn.disabled = false;
      showError(e.message);
    }
  });

  // ---------- 進捗ポーリング ----------
  function pollProgress(jobId) {
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch("/api/progress/" + jobId);
        const job = await parseJson(res);
        if (!res.ok) throw new Error(job.error || "進捗を取得できませんでした。");

        const pct = job.percent || 0;
        $("pct").textContent = pct.toFixed(1) + "%";
        $("speed").textContent = job.speed || "";
        $("barFill").style.width = pct + "%";

        if (job.status === "processing") {
          $("progressStatus").innerHTML = '<span class="spinner"></span>変換・結合の後処理中...';
        }
        if (job.status === "done") {
          clearInterval(pollTimer); pollTimer = null;
          progressSection.classList.remove("show");
          dlBtn.disabled = false;
          result.className = "result show success";
          $("resultEmoji").textContent = "🎉";
          $("resultMsg").textContent = "ダウンロードが完了しました!\n「" + (job.filename || "") + "」";
          const link = $("saveLink");
          link.href = "/api/file/" + jobId;
          link.style.display = "inline-block";
          $("retryBtn").style.display = "none";
        }
        if (job.status === "error") {
          clearInterval(pollTimer); pollTimer = null;
          progressSection.classList.remove("show");
          dlBtn.disabled = false;
          showError(job.error || "ダウンロードに失敗しました。");
        }
      } catch (e) {
        clearInterval(pollTimer); pollTimer = null;
        progressSection.classList.remove("show");
        dlBtn.disabled = false;
        showError(e.message);
      }
    }, 600);
  }

  $("retryBtn").addEventListener("click", () => {
    result.classList.remove("show", "success", "error");
  });
})();
</script>
</body>
</html>
